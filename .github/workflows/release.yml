name: Release

# nuget-releaser releases itself. Every successful CI run of a push to main plans the next version from conventional
# commits (feat → minor, fix/perf → patch, `!`/BREAKING CHANGE → major, anything else → no release), builds the
# Native AOT binaries for that version, then runs the linux-x64 binary it just built: `nuget-releaser release` tags
# vX.Y.Z and creates the GitHub Release with the binaries attached (nuget-releaser.toml). Nothing is pushed to NuGet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "11.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    # No release while the repository is private: binaries would publish code nobody can see yet.
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The commit CI validated, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # From source: the binaries need the version before they can be built.
      - name: Build
        run: dotnet build src/NugetReleaser/NugetReleaser.csproj --configuration Release -p:GeneratePackageOnBuild=false

      - name: Plan
        id: plan
        run: |
          plan=$(dotnet run --project src/NugetReleaser/NugetReleaser.csproj --configuration Release --no-build -- plan --json)
          echo "$plan"
          package=$(jq -c '.packages[] | select(.id == "UnambitiousFx.NugetReleaser")' <<< "$plan")
          release=$(jq -r '.release' <<< "$package")
          # A newer run releases main as it is now; this one would only tag an older commit with the same version.
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "main moved on since this commit: the run for the newer commit releases it."
            release=false
          fi
          {
            echo "release=$release"
            echo "version=$(jq -r '.nextVersion' <<< "$package")"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.sha }}

  release:
    name: Tag and GitHub Release
    # Only once every binary is built: a failed build is simply re-run, and nothing was published yet.
    needs: [plan, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      # release packs the package before tagging, even with no feed to push it to.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Outside the work tree: release refuses to run with uncommitted changes.
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-releaser-${{ needs.plan.outputs.version }}-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Checksums
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum * > checksums.txt && cat checksums.txt

      # The release is made by the binary it ships.
      - name: Extract the linux-x64 binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/dist/nuget-releaser-${{ needs.plan.outputs.version }}-linux-x64.tar.gz" -C "$RUNNER_TEMP/bin" nuget-releaser

      # Idempotent: re-running this job after any failure finishes the release (existing tag and release are kept,
      # missing assets are uploaded).
      - name: Release
        run: '"$RUNNER_TEMP/bin/nuget-releaser" release --asset "$RUNNER_TEMP/dist/*"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # unambitiousfx.com builds these docs from main and the release tags, so it is redeployed after every run,
  # released or not, to pick up `docs:` fixes too. `release` is skipped both when nothing is released and when
  # `binaries` failed, so a skipped `release` only counts when the plan had nothing to release.
  # GITHUB_TOKEN cannot start workflows in another repo, hence the org app; skipped until DOCS_APP_CLIENT_ID is set.
  docs-site:
    name: Redeploy docs site
    needs: [plan, release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.plan.outputs.release != 'true')) && vars.DOCS_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get docs site token
        id: site
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_KEY }}
          owner: UnambitiousFx
          repositories: UnambitiousFx.github.io
          permission-actions: write

      - name: Redeploy docs site
        run: gh workflow run deploy.yml -R UnambitiousFx/UnambitiousFx.github.io
        env:
          GH_TOKEN: ${{ steps.site.outputs.token }}
